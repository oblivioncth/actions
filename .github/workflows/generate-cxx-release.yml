on:
  workflow_call:
    inputs:
      artifacts_run_id:
        required: true
        type: number
      doc_artifact_pattern:
        required: false
        type: string
        default: "*_Linux_Static_x64*"
      name_suffix:
        required: false
        type: string
        default: ""

jobs:
  update-docs:
    name: Update gh-pages (if applicable)
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.page-deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      doc_artifacts_path: ${{ github.workspace }}/DocArtifacts
    steps:
    - name: Get project details
      id: proj-details
      uses: oblivioncth/actions/cmake/get-project-details@v1
    - name: Download built doc artifacts
      if: steps.proj-details.outputs.has_docs == 'true'
      uses: actions/download-artifact@v8
      with:
        pattern: "${{ inputs.doc_artifact_pattern }}"
        path: ${{ env.doc_artifacts_path }}
        run-id: ${{ inputs.artifacts_run_id }}
        github-token: ${{ github.token }}
    - name: Determine doc folder path
      id: doc-folder
      if: steps.proj-details.outputs.has_docs == 'true'
      shell: pwsh
      run: |
        $doc_artifact = Get-ChildItem "$Env:doc_artifacts_path" -Directory | Select-Object -First 1
        if(-not $doc_artifact) {
            throw "No doc artifact available!"
        }

        $doc_folder = $null

        ### Try several approaches
        # 1) Exact expected path
        $project_name = "${{ steps.proj-details.outputs.name }}"
        $candidate = Join-Path $doc_artifact "share/doc/$project_name/html"
        if (Test-Path -LiteralPath $candidate -PathType Container) {
            $doc_folder = $candidate
        }

        # 2) share/doc/<something>/html (one level deep, name mismatch case)
        if (-not $doc_folder) {
            $shareDoc = Join-Path $doc_artifact "share/doc"
            if (Test-Path -LiteralPath $shareDoc -PathType Container) {
                $match = Get-ChildItem -LiteralPath $shareDoc -Directory -ErrorAction SilentlyContinue |
                    ForEach-Object {
                        $htmlPath = Join-Path $_.FullName "html"
                        if (Test-Path -LiteralPath $htmlPath -PathType Container) { $htmlPath }
                    } |
                    Select-Object -First 1

                if ($match) {
                    $doc_folder = $match
                }
            }
        }

        # 3) Recursive search for any 'html' folder containing index.html
        if (-not $doc_folder) {
            $match = Get-ChildItem -LiteralPath $doc_artifact -Directory -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq "html" } |
                Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "index.html") -PathType Leaf } |
                Select-Object -First 1 -ExpandProperty FullName

            if ($match) {
                $doc_folder = $match
            }
        }

        # 4) Nothing found
        if (-not $doc_folder) {
            throw "No docs found within doc artifact!"
        }

        echo "doc_folder=$doc_folder" >> $Env:GITHUB_OUTPUT
    - name: Setup pages
      if: steps.proj-details.outputs.has_docs == 'true'
      uses: actions/configure-pages@v4
    - name: Upload pages artifact
      if: steps.proj-details.outputs.has_docs == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.doc-folder.outputs.doc_folder }}
    - name: Deploy pages artifact
      id: page-deployment
      if: steps.proj-details.outputs.has_docs == 'true'
      uses: actions/deploy-pages@v4

  create-release:
    name: Create GitHub release
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    env:
      artifacts_path: ${{ github.workspace }}/Artifacts
    steps:
    - name: Get project details
      id: details
      uses: oblivioncth/actions/cmake/get-project-details@v1
    - name: Download built project artifacts (keep zips)
      uses: actions/download-artifact@v8
      with:
        path: ${{ env.artifacts_path }}
        skip-decompress: true
        run-id: ${{ inputs.artifacts_run_id }}
        github-token: ${{ github.token }}
    - name: Remove 'github-pages' artifact if present
      shell: pwsh
      run: |
        Remove-Item -Path "${{ env.artifacts_path }}/github-pages.zip" -ErrorAction SilentlyContinue
    - name: Form release name
      id: name
      run: |
        name="${{ github.event.repository.name }} Release v${{ steps.details.outputs.version }}"
        sfx="${{ inputs.name_suffix }}"
        [ -n "$sfx" ] && name="$name $sfx"
        echo "name=$name" >> $GITHUB_OUTPUT
    - name: Generate release
      uses: softprops/action-gh-release@v3
      with:
        name: "${{ steps.name.outputs.name }}"
        tag_name: "v${{ steps.details.outputs.version }}"
        fail_on_unmatched_files: true
        generate_release_notes: true
        files: |
          ${{ env.artifacts_path }}/*.zip
